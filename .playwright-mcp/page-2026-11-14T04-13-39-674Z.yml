          - heading "What I would do differently" [level=3] [ref=f9e163]
          - paragraph [ref=f9e164]: I would conduct more frequent usability testing with busy professionals to better validate time-saving features, also prototype and test the payment flow earlier to identify and resolve transaction-related friction points.
        - generic [ref=f9e166]:
          - heading "Lessons" [level=3] [ref=f9e167]
          - paragraph [ref=f9e168]: Throughout the design process, I learned that initial concepts are only a starting point. User research, usability testing, and continuous feedback played a critical role in shaping stronger, more inclusive solutions. The process reinforced that iteration is ongoing, and meaningful improvements emerge through repeated testing and refinement.
        - generic [ref=f9e170]:
          - heading "Tradeoffs" [level=3] [ref=f9e171]
          - paragraph [ref=f9e172]: Balancing speed of ordering with rich meal information, automation with user control, and visual appeal with accessibility kept the experience quick, inclusive, and trustworthy.
